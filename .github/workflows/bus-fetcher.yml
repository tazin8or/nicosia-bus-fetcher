name: Update Nicosia Bus 706

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install GTFS-RT library
        run: pip install gtfs-realtime-bindings

      - name: Fetch GTFS-RT and write to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta
          from google.transit import gtfs_realtime_pb2

          # Cyprus timezone (UTC+2, or UTC+3 in summer - adjust if needed)
          CYPRUS_OFFSET = timedelta(hours=2)
          cyprus_tz = timezone(CYPRUS_OFFSET)

          # Route mapping: GTFS route_id -> (short number, destination)
          ROUTE_MAP = {
              "420021": ("42", "Makario Stadium - SOPAZ - University of Cyprus"),
              "120012": ("12", "Solomou Sq. - Makario Stadium - Al. Panagouli"),
              # Add more routes here as needed
          }

          print("Downloading GTFS-RT...")
          resp = urllib.request.urlopen("http://20.19.98.194:8328/Api/api/gtfs-realtime", timeout=30)
          data = resp.read()
          print("Downloaded", len(data), "bytes")

          feed = gtfs_realtime_pb2.FeedMessage()
          feed.ParseFromString(data)

          arrivals = []
          STOP_ID = "3162"

          now_utc = datetime.now(timezone.utc)

          for entity in feed.entity:
              if entity.HasField("trip_update"):
                  tu = entity.trip_update
                  for stu in tu.stop_time_update:
                      if stu.stop_id == STOP_ID or stu.stop_id == "706":
                          raw_route = tu.trip.route_id if tu.trip.route_id else "?"
                          short_route, destination = ROUTE_MAP.get(raw_route, (raw_route, ""))

                          minutes = None
                          time_str = ""
                          if stu.HasField("arrival") and stu.arrival.HasField("time"):
                              eta_utc = datetime.fromtimestamp(stu.arrival.time, tz=timezone.utc)
                              eta_cyprus = eta_utc.astimezone(cyprus_tz)
                              minutes = max(0, round((eta_utc - now_utc).total_seconds() / 60))
                              time_str = eta_cyprus.strftime("%H:%M")

                          arrivals.append({
                              "route": short_route,
                              "destination": destination,
                              "minutes": minutes,
                              "time": time_str,
                              "live": True
                          })

          arrivals.sort(key=lambda x: x["minutes"] if x["minutes"] is not None else 999)
          print("Found arrivals:", len(arrivals))

          payload = {
              "stop": "Ave. Georgiou Griva Digeni - Neas Egkomis",
              "code": "706",
              "stop_id": STOP_ID,
              "updated": datetime.now(cyprus_tz).isoformat(),
              "arrivals": arrivals[:6]
          }

          kv_url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CF_ACCOUNT_ID"] + "/storage/kv/namespaces/" + os.environ["CF_NAMESPACE_ID"] + "/values/stop_706"
          kv_req = urllib.request.Request(
              kv_url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["CF_API_TOKEN"],
                  "Content-Type": "application/json"
              },
              method="PUT"
          )
          print("KV:", urllib.request.urlopen(kv_req).read().decode())
          PY

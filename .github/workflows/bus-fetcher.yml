name: Update Nicosia Bus 706

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SIRI and write to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, re
          from datetime import datetime

          def call_siri(ref):
              soap = """<?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <GetStopMonitoring xmlns="http://tempuri.org/">
                <request>
                  <Request version="1.3" xmlns="">
                    <MonitoringRef xmlns="http://www.siri.org.uk/siri">""" + ref + """</MonitoringRef>
                    <MaximumStopVisits xmlns="http://www.siri.org.uk/siri">8</MaximumStopVisits>
                    <StopMonitoringDetailLevel xmlns="http://www.siri.org.uk/siri">normal</StopMonitoringDetailLevel>
                  </Request>
                </request>
              </GetStopMonitoring>
            </soap:Body>
          </soap:Envelope>"""
              req = urllib.request.Request(
                  "http://20.19.98.194:8313/SiriWS.asmx",
                  data=soap.encode(),
                  headers={
                      "Content-Type": "text/xml; charset=utf-8",
                      "SOAPAction": "http://tempuri.org/GetStopMonitoring",
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              try:
                  resp = urllib.request.urlopen(req, timeout=20)
                  xml = resp.read().decode()
                  visits = xml.count("<MonitoredStopVisit")
                  print("REF=" + ref + " LEN=" + str(len(xml)) + " VISITS=" + str(visits))
                  return xml
              except Exception as e:
                  print("REF=" + ref + " ERROR: " + str(e))
                  return ""

          print("Testing stop references...")
          xml706 = call_siri("706")
          xml3162 = call_siri("3162")

          print("Checking GTFS-RT...")
          try:
              gtfs = urllib.request.urlopen("http://20.19.98.194:8328/Api/api/gtfs-realtime", timeout=15)
              data = gtfs.read()
              print("GTFS-RT OK length=" + str(len(data)))
          except Exception as e:
              print("GTFS-RT error: " + str(e))

          payload = {
              "stop": "Ave. Georgiou Griva Digeni - Neas Egkomis",
              "code": "706",
              "updated": datetime.utcnow().isoformat() + "Z",

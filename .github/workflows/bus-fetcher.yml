import os, json, urllib.request, re
from datetime import datetime

def try_siri(ref):
    SOAP = f'''<?xml version="1.0" encoding="utf-8"?>
    <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
      <soap:Body>
        <GetStopMonitoring xmlns="http://tempuri.org/">
          <request>
            <ServiceRequestInfo>
              <RequestTimestamp>{datetime.utcnow().isoformat()}Z</RequestTimestamp>
              <RequestorRef>test</RequestorRef>
            </ServiceRequestInfo>
            <Request version="1.3" xmlns="">
              <MonitoringRef xmlns="http://www.siri.org.uk/siri">{ref}</MonitoringRef>
              <MaximumStopVisits xmlns="http://www.siri.org.uk/siri">8</MaximumStopVisits>
              <StopMonitoringDetailLevel xmlns="http://www.siri.org.uk/siri">normal</StopMonitoringDetailLevel>
            </Request>
          </request>
        </GetStopMonitoring>
      </soap:Body>
    </soap:Envelope>'''

    req = urllib.request.Request(
        "http://20.19.98.194:8313/SiriWS.asmx",
        data=SOAP.encode(),
        headers={
            "Content-Type": "text/xml; charset=utf-8",
            "SOAPAction": "http://tempuri.org/GetStopMonitoring",
            "User-Agent": "Mozilla/5.0"
        }
    )
    try:
        with urllib.request.urlopen(req, timeout=20) as r:
            xml = r.read().decode()
        visits = len(re.findall(r'<MonitoredStopVisit', xml, re.I))
        print(f"SIRI REF={ref}  LEN={len(xml)}  VISITS={visits}")
        if visits > 0:
            idx = xml.find('<MonitoredStopVisit')
            print("SAMPLE:", xml[idx:idx+500])
        return xml, visits
    except Exception as e:
        print(f"SIRI REF={ref} ERROR:", e)
        return "", 0

# Test a couple of references with the fuller request
for ref in ["706", "3162"]:
    try_siri(ref)


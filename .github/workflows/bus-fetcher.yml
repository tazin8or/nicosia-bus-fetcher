name: Update Nicosia Bus 706

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SIRI and write to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, re
          from datetime import datetime

          STOP_ID = "3162"
          SOAP = f'''<?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <GetStopMonitoring xmlns="http://tempuri.org/">
                <request>
                  <Request version="1.3" xmlns="">
                    <MonitoringRef xmlns="http://www.siri.org.uk/siri">{STOP_ID}</MonitoringRef>
                    <MaximumStopVisits xmlns="http://www.siri.org.uk/siri">8</MaximumStopVisits>
                    <StopMonitoringDetailLevel xmlns="http://www.siri.org.uk/siri">normal</StopMonitoringDetailLevel>
                  </Request>
                </request>
              </GetStopMonitoring>
            </soap:Body>
          </soap:Envelope>'''

          req = urllib.request.Request(
              "http://20.19.98.194:8313/SiriWS.asmx",
              data=SOAP.encode(),
              headers={
                  "Content-Type": "text/xml; charset=utf-8",
                  "SOAPAction": "http://tempuri.org/GetStopMonitoring",
                  "User-Agent": "Mozilla/5.0"
              }
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              xml = r.read().decode()

          print("XML snippet:", xml[:1000].replace("\n", " "))

          arrivals = []
          for block in re.findall(r'<MonitoredStopVisit[^>]*>[\s\S]*?</MonitoredStopVisit>', xml, re.I):
              def tag(t):
                  m = re.search(rf'<{t}[^>]*>([^<]+)</{t}>', block, re.I)
                  return m.group(1).strip() if m else None

              route = tag("LineRef") or tag("PublishedLineName") or tag("LineName")
              if not route:
                  continue
              dest = tag("DestinationName") or tag("DestinationDisplay") or ""
              expected = tag("ExpectedArrivalTime") or tag("ExpectedDepartureTime")
              aimed = tag("AimedArrivalTime") or tag("AimedDepartureTime")

              minutes = None
              time_str = ""
              use_time = expected or aimed
              if use_time:
                  try:
                      eta = datetime.fromisoformat(use_time.replace("Z", "+00:00"))
                      minutes = max(0, round((eta - datetime.now(eta.tzinfo)).total_seconds() / 60))
                      time_str = eta.strftime("%H:%M")
                  except Exception as e:
                      print("Time parse error:", e)

              arrivals.append({
                  "route": route.split("/")[-1],
                  "destination": dest,
                  "minutes": minutes,
                  "time": time_str,
                  "live": bool(expected)
              })

          arrivals.sort(key=lambda x: x["minutes"] if x["minutes"] is not None else 999)

          payload = {
              "stop": "Ave. Georgiou Griva Digeni - Neas Egkomis",
              "code": "706",
              "stop_id": STOP_ID,
              "updated": datetime.utcnow().isoformat() + "Z",
              "arrivals": arrivals[:6],
              "debug_count": len(arrivals)
          }

          print("Found arrivals:", len(arrivals))

          kv_url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/storage/kv/namespaces/{os.environ['CF_NAMESPACE_ID']}/values/stop_706"
          kv_req = urllib.request.Request(
              kv_url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['CF_API_TOKEN']}",
                  "Content-Type": "application/json"
              },
              method="PUT"
          )
          with urllib.request.urlopen(kv_req) as kv_resp:
              print("KV response:", kv_resp.read().decode())
          PY

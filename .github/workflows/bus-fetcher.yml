name: Update Nicosia Bus 706

on:
  workflow_dispatch:          # Allows the Sticky (or cron-job.org) to trigger it
  schedule:
    - cron: "0 */6 * * *"     # Optional slow backup every 6 hours

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GTFS-RT and write to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta

          STOP_ID = "3162"
          ROUTE_MAP = {
              "420021": ("42", "Makario Stadium - SOPAZ - University of Cyprus"),
              "120012": ("12", "Solomou Sq. - Makario Stadium - Al. Panagouli"),
          }

          url = "http://20.19.98.194:8328/Api/api/gtfs-realtime"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  raw = r.read()
              print(f"Downloaded {len(raw)} bytes")
          except Exception as e:
              print("Fetch failed:", e)
              raise

          # === Replace this section with your working GTFS-RT parsing logic ===
          # The version that previously produced correct arrivals with route mapping
          # and Cyprus timezone should be inserted here.
          arrivals = []
          # Example structure (replace with real parsing):
          # arrivals.append({
          #     "route": "42",
          #     "destination": "...",
          #     "minutes": 7,
          #     "time": "14:22",
          #     "live": True
          # })

          # Sort by minutes
          arrivals.sort(key=lambda x: x.get("minutes") if x.get("minutes") is not None else 999)

          payload = {
              "stop": "Ave. Georgiou Griva Digeni - Neas Egkomis",
              "code": "706",
              "stop_id": STOP_ID,
              "updated": datetime.now(timezone(timedelta(hours=2))).isoformat(),
              "arrivals": arrivals[:6]
          }

          print("Arrivals found:", len(arrivals))

          kv_url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/storage/kv/namespaces/{os.environ['CF_NAMESPACE_ID']}/values/stop_706"
          kv_req = urllib.request.Request(
              kv_url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['CF_API_TOKEN']}",
                  "Content-Type": "application/json"
              },
              method="PUT"
          )
          with urllib.request.urlopen(kv_req) as kv_resp:
              print("KV response:", kv_resp.read().decode())
          PY
